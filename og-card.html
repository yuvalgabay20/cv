<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source</title>
<style>
  /* Rendered once at 1200x630 by build-og.ps1 into docs/og.png.
     Same palette and faces as the page, so the preview and the page
     read as one thing. */
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    background: #0A0D15;
    color: #ECEAE4;
    font-family: "Segoe UI", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .glow-warm, .glow-cool { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow-warm { width: 760px; height: 760px; right: -180px; top: -300px; background: rgba(228,172,72,.22); }
  .glow-cool { width: 700px; height: 700px; left: -240px; bottom: -320px; background: rgba(58,124,186,.20); }

  .grid {
    position: absolute; right: 74px; top: 50%;
    width: 420px; height: 300px;
    transform: translateY(-50%) perspective(900px) rotateY(-24deg) rotateX(10deg);
    background-image:
      linear-gradient(rgba(228,172,72,.34) 1px, transparent 1px),
      linear-gradient(90deg, rgba(228,172,72,.34) 1px, transparent 1px);
    background-size: 30px 24px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 35%, transparent 78%);
    mask-image: radial-gradient(ellipse at 50% 50%, #000 35%, transparent 78%);
  }
  .scan {
    position: absolute; right: 236px; top: 50%;
    transform: translateY(-50%);
    width: 52px; height: 300px;
    background: linear-gradient(90deg, transparent, rgba(228,172,72,.5), transparent);
    filter: blur(2px);
  }

  .wrap { position: relative; padding: 74px 80px; height: 100%; display: flex; flex-direction: column; }

  .cap {
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 15px; letter-spacing: .22em; text-transform: uppercase;
    color: #778394;
  }
  .cap b { color: #E4AC48; font-weight: 600; }

  .name {
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    font-size: 104px; line-height: .92; letter-spacing: -.025em;
    margin-top: auto;
  }
  .name em { font-style: italic; color: #E4AC48; }

  .role {
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    font-size: 33px; line-height: 1.3; margin-top: 26px; color: #ECEAE4;
  }

  .foot {
    margin-top: auto;
    padding-top: 30px;
    border-top: 1px solid #242D3C;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
    color: #778394;
  }
  .foot b { color: #ECEAE4; font-weight: 400; }
</style>
</head>
<body>
  <div class="glow-warm"></div>
  <div class="glow-cool"></div>
  <div class="grid"></div>
  <div class="scan"></div>

  <div class="wrap">
    <div class="cap"><b>CV</b> &nbsp;&mdash;&nbsp; BIPA 2026</div>
    <div class="name">Yuval<br><em>Gabay</em></div>
    <div class="role">Law student. Graphic designer. Self-taught builder.</div>
    <div class="foot">
      <span>Two apps built <b>&amp; running</b></span>
      <span>yuvalgabay20.github.io/cv</span>
    </div>
  </div>
</body>
</html>
